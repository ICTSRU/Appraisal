<!DOCTYPE html>
<html lang="ar" dir="rtl">

<?!= include('Style') ?>
<style>
:root{--s1:#7d52c4;--s2:#1b86c4}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--border);border-top:3px solid var(--purple);border-radius:var(--radius);padding:10px 14px}
.tile .l{color:var(--muted);font-size:.8rem}
.tile .v{font-size:1.6rem;font-weight:800;color:var(--purple-dark);line-height:1.2}
.tile .s{font-size:.8rem;color:var(--muted)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.tile .v,.bars .val,.heat td,.up,.down{direction:ltr;unicode-bidi:isolate}
.tile .v .band{direction:rtl}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.bars .r{display:grid;grid-template-columns:110px 1fr 150px;gap:8px;align-items:center;margin-bottom:5px;font-size:.88rem}
.bars .track{position:relative;background:#f0ebf8;height:16px;border-radius:0 2px 2px 0}
.bars .fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--purple);border-radius:0 4px 4px 0}
.bars .avg{position:absolute;inset-block:-3px;width:0;border-inline-start:2px dashed var(--ink)}
.bars .prev{position:absolute;inset-block:2px;width:3px;background:var(--s2)}
.bars .val{font-weight:700;font-family:Arial,sans-serif;direction:ltr;text-align:start}
@media (max-width:600px){.bars .r{grid-template-columns:80px 1fr 110px}}
.heat td{text-align:center;font-family:Arial,sans-serif;min-width:54px}
.heat td.n{text-align:start;font-family:inherit;white-space:nowrap}
.heat th{font-size:.72rem;max-width:90px}
svg text{font-family:Arial,Cairo,sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;margin:4px 0}
.legend i{display:inline-block;width:18px;height:3px;margin-inline-end:5px;vertical-align:middle;background:var(--s1)}
.legend i.d{background:repeating-linear-gradient(90deg,var(--s2) 0 6px,transparent 6px 10px)}
#tip{position:fixed;pointer-events:none;background:#241436;color:#fff;border-radius:4px;padding:5px 10px;font-size:.8rem;z-index:70;display:none;max-width:260px}
.list li{margin-bottom:4px}
.pill{display:inline-block;background:var(--purple-light);border-radius:999px;padding:0 8px;font-size:.78rem}
</style>
